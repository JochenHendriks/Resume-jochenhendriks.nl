name: Build and Deploy Static HTML to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'resume.json'
      - 'ui-config.json'
      - 'template.html'
      - 'build.js'
      - 'tailwind.config.js'
      - 'src/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.2.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate static HTML
        run: node build.js

      - name: Auto-commit updated index.html to main branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status -s index.html dist/tailwind.css) ]]; then
            git add index.html dist/tailwind.css
            git commit -m "chore(build): auto-generate static index.html from updated resume data [skip ci]"
            git push origin main
          else
            echo "No changes in generated static HTML"
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
