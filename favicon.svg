<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Soft shadow behind sticky note -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
    <!-- Red Pushpin gradient -->
    <radialGradient id="pinGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="45%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
  </defs>

  <!-- Yellow Sticky Note Body -->
  <g transform="rotate(-3 32 32)" filter="url(#dropShadow)">
    <rect x="6" y="8" width="50" height="50" rx="6" fill="#fef08a" stroke="#fde047" stroke-width="1.5"/>
    
    <!-- Folded Corner Effect (Bottom Right) -->
    <path d="M46 58 L56 48 L46 48 Z" fill="#eab308" opacity="0.6"/>
    <path d="M46 58 L56 48 L56 58 Z" fill="#ffffff" opacity="0.95"/>
    
    <!-- Hand-drawn 'J' in Teal Marker Font -->
    <path d="M34 20 L34 38 C34 44 26 45 22 40 C20 37 21 34 23 33 C25 32 28 35 29 37" 
          stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Playful Agile Coach Star Sparkle / Dot -->
    <circle cx="34" cy="18" r="3" fill="#0f766e"/>
  </g>

  <!-- Realistic Red Pushpin on Top Left -->
  <circle cx="16" cy="12" r="6" fill="url(#pinGrad)"/>
  <circle cx="14" cy="10" r="1.8" fill="#ffffff" opacity="0.75"/>
</svg>
